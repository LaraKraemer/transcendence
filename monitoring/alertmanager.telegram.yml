# Sends grouped alarms and recovery messages to Telegram using local secret files.
route:
  receiver: telegram
  group_by: [alertname, job]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: |-
          Expense Tracker: {{ .Status | toUpper }}
          {{ range .Alerts }}
          [{{ .Status | toUpper }}] {{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
