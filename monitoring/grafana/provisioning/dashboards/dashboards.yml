# Tells Grafana where to load dashboard JSON files and which folder to display them in.
apiVersion: 1

providers:
  - name: expense-tracker
    orgId: 1
    folder: Poolaki
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards