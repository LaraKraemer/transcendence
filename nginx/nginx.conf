ssl_certificate     /etc/nginx/certs/localhost.pem;
ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
ssl_protocols       TLSv1.2 TLSv1.3;

# Same limit as serverActions.bodySizeLimit in frontend/next.config.ts.
client_max_body_size 6m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

server {
    listen 443 ssl default_server;

    # 497 is Nginx's code for plain HTTP sent to an HTTPS port.
    error_page 497 =301 https://$http_host$request_uri;

    location / {
        proxy_pass http://frontend:3000;
    }
}

# The API needs its own port: its routes overlap the frontend's pages (/analytics, /auth/google),
# and only the same hostname shares the session cookie with the avatar and CSV export requests.
server {
    listen 8443 ssl default_server;

    location / {
        proxy_pass http://backend:3001;
    }
}
