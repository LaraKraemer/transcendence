services:

  db:
    image: postgres:17-alpine

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_tracker

    # The backend waits for this before starting. Without it the backend races
    # Postgres on first boot: Postgres accepts connections briefly during
    # initdb, then restarts, and the migration step fails.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: ./backend


    ports:
      - "3001:3001"

    volumes:
      - ./backend:/app
      # Keep the repository-level formatting rules available above /app.
      - ./.prettierrc.json:/.prettierrc.json:ro
      - /app/node_modules
      - avatar-data:/app/avatars
      - ./backups:/backups:ro

    environment:
      NODE_ENV: development
      # Host is the compose service name "db" — a server-side connection,
      # unlike the browser-facing NEXT_PUBLIC_API_URL below.
      DATABASE_URL: postgres://expense:expense@db:5432/expense_tracker

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    command: npm run dev


  frontend:
    build:
      context: ./frontend


    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      # Browser-facing URL for the client bundle (user's browser hits localhost).
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server-side URL for server components / actions / DAL. Inside the Docker
      # network the backend is reached by its compose service name, not localhost.
      API_URL: http://backend:3001

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

    command: npm run dev


  backup:
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    environment:
      PGHOST: db
      PGUSER: expense
      PGPASSWORD: expense
      PGDATABASE: expense_tracker
    volumes:
      - ./backups:/backups
      - avatar-data:/avatars
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  avatar-data:
