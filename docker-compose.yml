services:

  db:
    image: postgres:17-alpine

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: expense_tracker

    # The backend waits for this before starting. Without it the backend races
    # Postgres on first boot: Postgres accepts connections briefly during
    # initdb, then restarts, and the migration step fails.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: ./backend

    user: root

    volumes:
      - ./backend:/app
      # Keep the repository-level formatting rules available above /app.
      - ./.prettierrc.json:/.prettierrc.json:ro
      - /app/node_modules
      - avatar-data:/app/avatars
      - ./backups:/backups:ro

    environment:
      NODE_ENV: development
      # Reachable by Prometheus inside Docker; host runs default to loopback.
      METRICS_HOST: 0.0.0.0
      # Host is the compose service name "db" — a server-side connection,
      # unlike the browser-facing NEXT_PUBLIC_API_URL below.
      DATABASE_URL: "postgres://${POSTGRES_USER:?POSTGRES_USER must be set in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/expense_tracker"
      FRONTEND_ORIGIN: https://localhost:3000
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      # Google sign-in, read from the git-ignored .env next to this file.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Two-factor authentication: 32 random bytes, base64 (openssl rand -base64 32). Unset disables 2FA setup.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    command: npm run dev


  frontend:
    build:
      context: ./frontend

    # next dev writes into ./frontend (next-env.d.ts). Under rootless Docker (42 computers) only
    user: root

    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Keeps the build cache in the container, so root-written cache files stay off the host.
      - /app/.next
      # Only the public CA certificate: this directory holds no private key.
      - ./nginx/certs/ca:/etc/ssl/local-ca:ro

    environment:
      NODE_ENV: development
      # Browser-facing URL for the client bundle (user's browser hits localhost).
      NEXT_PUBLIC_API_URL: https://localhost:8443
      # Server-side URL for server components / actions / DAL. Inside the Docker
      # network the proxy is reached by its compose service name, not localhost.
      API_URL: https://nginx:8443
      NODE_EXTRA_CA_CERTS: /etc/ssl/local-ca/rootCA.pem
      COOKIE_SECURE: "true"
      # Public OAuth client ID for the Google redirect (app/auth/google/route.ts).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

    command: npm run dev


  nginx:
    image: nginx:1.28-alpine

    # Unprivileged host ports, so rootless Docker can publish them too.
    ports:
      - "3000:443"
      - "8443:8443"
      # Keep the administrative monitoring UI local to this computer.
      - "127.0.0.1:3002:3002"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - backend
      - frontend


  backup:
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    environment:
      PGHOST: db
      PGUSER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      PGDATABASE: expense_tracker
    volumes:
      - ./backups:/backups
      - avatar-data:/avatars
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Collects metrics and checks alert rules; browser access requires the debug Compose file.
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep measurements for 15 days.
      - --storage.tsdb.retention.time=15d

    volumes:
      - ./monitoring:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # Receives Prometheus alerts; the Telegram Compose file enables external messages.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # A single instance does not need Alertmanager cluster communication.
      - --cluster.listen-address=

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  # Creates or updates the restricted monitoring user before the exporter starts.
  monitoring-db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: "${POSTGRES_USER:?POSTGRES_USER must be set in .env}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      PGDATABASE: expense_tracker
      POSTGRES_EXPORTER_PASSWORD: "${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD must be set in .env}"
    command: ["psql", "--no-psqlrc", "--set=ON_ERROR_STOP=1", "--file=/monitoring/db-init.sql"]
    volumes:
      - ./monitoring/db-init.sql:/monitoring/db-init.sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Reads database statistics using the separate monitoring user and exposes them internally.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped

    environment:
      DATA_SOURCE_URI: "db:5432/expense_tracker?sslmode=disable"
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD must be set in .env}"

    depends_on:
      db:
        condition: service_healthy
      monitoring-db-init:
        condition: service_completed_successfully

  # Provides container CPU and memory measurements to Prometheus.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped

    volumes:
      # Read system and Docker information; these mounts depend on the Docker host.
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  # Loads dashboards and the Prometheus data source automatically from project files.
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped

    environment:
      # Set the initial admin account; require login and disable public sign-up.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://localhost:3002
      GF_SECURITY_COOKIE_SECURE: "true"

    volumes:
      # Keep Grafana data across restarts; load configuration files read-only.
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  db-data:
  avatar-data:
  # Preserve collected metrics, dashboards and alert delivery state across restarts.
  prometheus-data:
  grafana-data:
  alertmanager-data:
