name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "nginx/**"
      - "Makefile"
      - ".github/workflows/backend-unit-tests.yml"
      - ".nvmrc"
      - ".prettierrc.json"
  pull_request:
    paths:
      - "backend/**"
      - "nginx/**"
      - "Makefile"
      - ".github/workflows/backend-unit-tests.yml"
      - ".nvmrc"
      - ".prettierrc.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        # Disposable CI-only database; deployment credentials come from the root .env.
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense -d expense_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://expense:expense@localhost:5432/expense_tracker
      TEST_PASSWORD: ci-only-test-password
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      # Throwaway key (32 zero bytes) so the Bruno 2FA requests can run.
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - name: Create local certificates
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y mkcert && make certs
      - name: Start HTTPS proxy
        working-directory: .
        run: >-
          docker run -d --network host --add-host frontend:127.0.0.1 --add-host backend:127.0.0.1
          -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/nginx/certs:/etc/nginx/certs:ro" nginx:1.28-alpine
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Start API and apply migrations
        run: npx --no-install tsx srcs/index.ts > api.log 2>&1 &
      - name: Wait for API readiness
        run: timeout 60 bash -c 'until curl -fsS --cacert ../nginx/certs/ca/rootCA.pem https://localhost:8443/health; do sleep 1; done'
      - name: Run API collection
        run: npx --no-install bru run --env local --cacert ../../nginx/certs/ca/rootCA.pem
        working-directory: backend/bruno
      - name: Print API log on failure
        if: failure()
        run: cat api.log
