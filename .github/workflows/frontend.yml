name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "nginx/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
      - ".nvmrc"
  pull_request:
    paths:
      - "frontend/**"
      - "nginx/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:format
      - run: npm run check:import
      - run: npm run check:filters
      - run: npm run build

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense -d expense_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://expense:expense@localhost:5432/expense_tracker
      API_URL: https://localhost:8443
      NEXT_PUBLIC_API_URL: https://localhost:8443
      # next start already holds port 3000 here, so the host-networked proxy stays on 443.
      FRONTEND_URL: https://localhost
      FRONTEND_ORIGIN: https://localhost
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/nginx/certs/ca/rootCA.pem
      # Throwaway key so the profile's "Enable two-factor authentication" dialog can open.
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - name: Create local certificates
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y mkcert libnss3-tools
          # mkcert only adds its CA to a Chromium certificate database that already exists.
          mkdir -p ~/.pki/nssdb && certutil -d sql:$HOME/.pki/nssdb -N --empty-password
          make certs
      - name: Start HTTPS proxy
        working-directory: .
        run: >-
          docker run -d --network host --add-host frontend:127.0.0.1 --add-host backend:127.0.0.1
          -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$PWD/nginx/certs:/etc/nginx/certs:ro" nginx:1.28-alpine
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start API and apply migrations
        run: npx --no-install tsx srcs/index.ts > api.log 2>&1 &
        working-directory: backend
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - name: Start frontend
        run: npm run start > next.log 2>&1 &
      - name: Wait for API and frontend
        run: timeout 60 bash -c 'until curl -fsS --cacert ../nginx/certs/ca/rootCA.pem https://localhost:8443/health && curl -fsS --cacert ../nginx/certs/ca/rootCA.pem -o /dev/null https://localhost/login; do sleep 1; done'
      - name: Check status page behavior
        run: node status.check.mjs
      - run: npm run check:a11y
      - name: Print logs on failure
        if: failure()
        run: cat ../backend/api.log next.log
